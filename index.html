<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ngữ pháp HSK 5 — từ nền tảng đến nâng cao</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f1;--card:#fff;--ink:#1b2a31;--mute:#5b6b72;--line:#d3dedb;--jade:#1f7a6d;--jade2:#dcefe9;--seal:#b3261e;--ok:#1f7a6d;--bad:#b3261e;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10181b;--card:#17232a;--ink:#e6eeec;--mute:#93a5a9;--line:#2a3a41;--jade:#5cc4b0;--jade2:#1d3a38;--seal:#ff8a80;--ok:#5cc4b0;--bad:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10181b;--card:#17232a;--ink:#e6eeec;--mute:#93a5a9;--line:#2a3a41;--jade:#5cc4b0;--jade2:#1d3a38;--seal:#ff8a80;--ok:#5cc4b0;--bad:#ff8a80;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Be Vietnam Pro",system-ui,sans-serif}
.zh{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
main{max-width:760px;margin:0 auto;padding:28px 18px 60px}
header h1{font-family:"Noto Serif SC",serif;font-size:2.1rem;margin:0 0 4px;line-height:1.2}
header p{margin:0;color:var(--mute)}
.bar{height:8px;background:var(--line);border-radius:4px;margin:18px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--jade);width:0;transition:width .3s}
.stat{font-size:.9rem;color:var(--mute);display:flex;justify-content:space-between}
.stat button{background:none;border:0;color:var(--mute);cursor:pointer;text-decoration:underline;font:inherit}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:20px 0}
.tabs button{padding:10px 6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;cursor:pointer;font:inherit;font-size:.85rem;line-height:1.3}
.tabs button b{display:block;font-size:.95rem}
.tabs button[aria-selected="true"]{background:var(--jade);border-color:var(--jade);color:#fff}
@media(max-width:520px){.tabs{grid-template-columns:repeat(2,1fr)}}
details{background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:10px}
summary{padding:14px 16px;cursor:pointer;display:flex;gap:10px;align-items:center;list-style:none}
summary::-webkit-details-marker{display:none}
summary .t{flex:1;font-weight:600}
summary .t span{font-family:"Noto Serif SC",serif;font-size:1.15rem}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--line)}
details.done .dot{background:var(--jade);border-color:var(--jade)}
.body{padding:0 16px 16px;border-top:1px solid var(--line)}
.pat{font-family:"Noto Serif SC",serif;font-size:1.2rem;font-weight:700;color:var(--jade);margin:14px 0 6px}
.ex{background:var(--jade2);border-left:4px solid var(--seal);border-radius:4px;padding:10px 14px;margin:12px 0}
.ex .zh{font-size:1.4rem;line-height:1.5}
.ex small{display:block;color:var(--mute)}
.quiz p{margin:12px 0 6px;font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{padding:8px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;cursor:pointer;font:inherit}
.opts button.ok{border-color:var(--ok);background:var(--ok);color:#fff}
.opts button.bad{border-color:var(--bad);color:var(--bad)}
.fb{min-height:1.5em;margin:6px 0 0;font-size:.9rem}
label.chk{display:flex;gap:8px;align-items:center;margin-top:12px;cursor:pointer;font-size:.92rem}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid var(--jade);outline-offset:2px}
footer{margin-top:28px;font-size:.85rem;color:var(--mute)}

.tabs[hidden]{display:none}
.item{width:100%;display:flex;gap:10px;align-items:center;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:10px;cursor:pointer;font:inherit}
.item .t{flex:1;font-weight:600}.item .t .zh{font-size:1.15rem}.item small{color:var(--mute)}
.item.done .dot{background:var(--jade);border-color:var(--jade)}
.back,.nav button,.fill button,#clr,#rt{padding:8px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;cursor:pointer;font:inherit}
.back{margin-bottom:14px}.nav{display:flex;justify-content:space-between;margin-top:22px}
button.pri{background:var(--jade);border-color:var(--jade);color:#fff}
button:disabled{opacity:.4;cursor:default}
#list h2{margin:0 0 4px;font-size:1.6rem}#list h3{margin:14px 0 6px}
.stepbar{font-size:.85rem;color:var(--mute)}
.q{font-size:1.1rem;font-weight:600;margin:8px 0 12px}
.fill{display:flex;gap:8px}.fill input{flex:1;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font:inherit;font-size:1.1rem}
.ans{min-height:52px;border:2px dashed var(--line);border-radius:8px;padding:8px;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:8px}
.ans button,#pool button{font-size:1.2rem}
#list ul{padding-left:20px}#list li{margin-bottom:6px}
</style>
</head>
<body>
<main>
<header>
<h1>Ngữ pháp HSK 5</h1>
<p>23 điểm ngữ pháp xếp từ dễ đến khó. Mỗi điểm chia thành các phần nhỏ: cấu trúc, cách dùng, ví dụ và 5 bài tập.</p>
</header>
<div class="bar"><i id="fill"></i></div>
<div class="stat"><span id="cnt"></span><button id="reset" type="button">Xóa tiến độ</button></div>
<div class="tabs" id="tabs" role="tablist"></div>
<div id="list"></div>
<footer>Tiến độ được lưu trên trình duyệt của bạn. Để thêm bài, thêm một dòng vào mảng <code>D</code> trong index.html và một mảng bài tập tương ứng trong exercises.js.</footer>
</main>
<script src="exercises.js"></script>
<script>
const S=["Nền tảng|HSK 1–2","Sơ trung cấp|HSK 3","Trung cấp|HSK 4","Nâng cao|HSK 5"];
// [stage, title, pattern, explanation, zh, pinyin, vi, quiz, options, answerIndex]
const D=[
[0,"了 — hoàn thành","S + V + 了 + (O)","Diễn tả hành động đã hoàn thành. Phủ định dùng 没(有) và bỏ 了.","我昨天买了一本书。","Wǒ zuótiān mǎi le yì běn shū.","Hôm qua tôi đã mua một quyển sách.","Phủ định của 我吃了饭 là:",["我不吃了饭","我没吃饭","我没吃了饭"],1],
[0,"比 — so sánh hơn","A + 比 + B + Adj","Không thêm 很 trước tính từ. Muốn nói chênh lệch bao nhiêu, đặt sau tính từ: 高一点儿, 高很多.","今天比昨天冷。","Jīntiān bǐ zuótiān lěng.","Hôm nay lạnh hơn hôm qua.","Câu đúng là:",["他比我很高","他比我高","他比我高很"],1],
[0,"过 — đã từng","S + V + 过 + (O)","Diễn tả từng trải qua một việc. Phủ định: 没(有) + V + 过.","我去过中国。","Wǒ qù guo Zhōngguó.","Tôi đã từng đến Trung Quốc.","“Tôi chưa từng ăn vịt quay”:",["我没吃过烤鸭","我不吃过烤鸭","我没吃了烤鸭"],0],
[0,"在 — đang làm","S + (正)在 + V (+ 呢)","Hành động đang diễn ra. 正, 正在, 呢 có thể đi kèm để nhấn mạnh.","他正在看电视呢。","Tā zhèngzài kàn diànshì ne.","Anh ấy đang xem tivi.","Chọn câu “đang ăn cơm”:",["我吃了饭","我吃过饭","我在吃饭"],2],
[1,"把 — xử lý tân ngữ","S + 把 + O + V + thành phần khác","Nhấn mạnh tác động lên O (O phải xác định). Sau động từ phải có 了, bổ ngữ hoặc địa điểm, không để động từ đứng trơ trọi.","请把门关上。","Qǐng bǎ mén guān shàng.","Xin hãy đóng cửa lại.","Câu đúng là:",["我把书看","我把书看完了","我把看书完了"],1],
[1,"被 — bị động","O + 被 + (S) + V + thành phần khác","Câu bị động, hay dùng cho việc không mong muốn. Khẩu ngữ có thể dùng 让 hoặc 叫 thay 被.","我的手机被偷走了。","Wǒ de shǒujī bèi tōu zǒu le.","Điện thoại của tôi bị trộm mất rồi.","被 dùng để diễn đạt:",["Câu so sánh","Câu bị động","Câu hỏi"],1],
[1,"Bổ ngữ kết quả","V + 完 / 好 / 到 / 见 / 懂","Chỉ kết quả của hành động. Phủ định dùng 没(有), không dùng 不.","我听懂了老师的话。","Wǒ tīng dǒng le lǎoshī de huà.","Tôi nghe hiểu lời thầy rồi.","“Làm xong bài tập”:",["做作业完","完做作业","做完作业"],2],
[1,"虽然…但是…","虽然 A，但是 / 可是 B","Nhượng bộ: “tuy… nhưng…”. Tiếng Trung thường dùng cả hai vế, trong khi tiếng Việt hay bỏ một.","虽然很累，但是我很开心。","Suīrán hěn lèi, dànshì wǒ hěn kāixīn.","Tuy rất mệt nhưng tôi rất vui.","Điền: 虽然下雨，___我们去了。",["因为","所以","但是"],2],
[1,"越来越","越来越 + Adj / V","Mức độ tăng dần theo thời gian: “ngày càng”.","天气越来越热了。","Tiānqì yuè lái yuè rè le.","Thời tiết ngày càng nóng.","“Ngày càng đẹp”:",["越来越漂亮","越漂亮来","来越越漂亮"],0],
[2,"Bổ ngữ khả năng","V + 得 / 不 + bổ ngữ","Nói làm được hay không làm được. Khẳng định chen 得, phủ định chen 不 giữa động từ và bổ ngữ.","这么多菜，我吃不完。","Zhème duō cài, wǒ chī bu wán.","Nhiều món vậy, tôi ăn không hết.","“Nghe không hiểu”:",["听不懂","不听懂","听懂不"],0],
[2,"Bổ ngữ xu hướng","V + 来 / 去 / 上 / 下 / 进 / 出 / 回 / 过 / 起 (+ 来 / 去)","Chỉ hướng di chuyển. 来 là hướng về phía người nói, 去 là hướng ra xa người nói.","他从包里拿出来一本书。","Tā cóng bāo lǐ ná chūlái yì běn shū.","Anh ấy lấy từ trong cặp ra một quyển sách.","走进来 nghĩa là:",["Đi ra ngoài","Đi vào (về phía người nói)","Đi lên"],1],
[2,"连…都 / 也…","连 + N + 都 / 也 + V","Nhấn mạnh mức độ cực đoan: “ngay cả… cũng…”.","他忙得连饭都没吃。","Tā máng de lián fàn dōu méi chī.","Anh ấy bận đến mức cơm cũng chưa ăn.","连 ở đây nhấn mạnh:",["Ngay cả","Vì vậy","Hơn nữa"],0],
[2,"即使…也…","即使 A，也 B","Nhượng bộ giả thiết: “cho dù… cũng…”. Kết quả B không đổi dù A xảy ra.","即使下雨，我也要去。","Jíshǐ xià yǔ, wǒ yě yào qù.","Dù trời mưa tôi cũng phải đi.","Điền: 即使很难，我___会坚持。",["却","才","也"],2],
[3,"无论…都…","无论 + từ nghi vấn / lựa chọn，都 / 也 + kết quả","Dù điều kiện thế nào, kết quả vẫn như nhau. Vế sau bắt buộc có 都 hoặc 也.","无论多忙，他都坚持锻炼。","Wúlùn duō máng, tā dōu jiānchí duànliàn.","Dù bận đến đâu, anh ấy vẫn kiên trì tập luyện.","Điền: 无论谁来，我___欢迎。",["都","却","才"],0],
[3,"既然…就…","既然 A，就 B","A là sự thật đã biết, B là kết luận hợp lý rút ra từ đó: “đã… thì…”.","既然你不舒服，就早点休息吧。","Jìrán nǐ bù shūfu, jiù zǎodiǎn xiūxi ba.","Đã không khỏe thì nghỉ sớm đi.","既然 khác 如果 ở chỗ:",["A chỉ là giả thiết","A là mục đích","A là sự thật đã biết"],2],
[3,"宁可…也不…","宁可 A，也不 B","Thà chọn A (phương án chấp nhận được) còn hơn B (phương án tệ hơn). Người nói chọn A.","我宁可走路，也不坐那么挤的车。","Wǒ nìngkě zǒulù, yě bù zuò nàme jǐ de chē.","Tôi thà đi bộ chứ không đi chiếc xe chật như vậy.","宁可 A 也不 B: người nói chọn",["Vế B","Vế A","Cả hai"],1],
[3,"与其…不如…","与其 A，不如 B","Ngược với 宁可: chọn vế sau. “Thay vì A, chi bằng B”.","与其在家玩手机，不如出去运动。","Yǔqí zài jiā wán shǒujī, bùrú chūqù yùndòng.","Thay vì ở nhà nghịch điện thoại, chi bằng ra ngoài vận động.","与其 A 不如 B: người nói chọn",["Vế A","Vế B","Không chọn gì"],1],
[3,"何况","A 都…，何况 B (呢)？","Suy luận tăng tiến: B còn rõ ràng hơn A nên càng đúng. Nghĩa “huống chi”.","大人都搬不动，何况孩子呢？","Dàrén dōu bān bu dòng, hékuàng háizi ne?","Người lớn còn bê không nổi, huống chi trẻ con?","何况 mang nghĩa:",["Nếu như","Tuy nhiên","Huống chi"],2],
[3,"反而","A，反而 B","B trái với dự đoán hoặc mong đợi sau khi A xảy ra: “ngược lại”.","吃了药，他的病反而更重了。","Chī le yào, tā de bìng fǎn’ér gèng zhòng le.","Uống thuốc rồi, bệnh anh ấy lại nặng hơn.","Dùng 反而 khi kết quả:",["Đúng như mong đợi","Trái với mong đợi","Không liên quan"],1],
[3,"难道…吗？","难道 + câu + 吗？","Câu hỏi tu từ thể hiện ngạc nhiên hoặc phản bác: “lẽ nào…?”.","你难道不知道今天放假吗？","Nǐ nándào bù zhīdào jīntiān fàngjià ma?","Lẽ nào bạn không biết hôm nay nghỉ sao?","难道 tạo ra câu hỏi kiểu:",["Tu từ, thể hiện ngạc nhiên","Hỏi thông tin thật","Mệnh lệnh"],0],
[3,"一旦…就…","一旦 A，就 B","Một khi A xảy ra thì B xảy ra; thường nói về hậu quả khó tránh.","一旦养成习惯，就很难改了。","Yídàn yǎngchéng xíguàn, jiù hěn nán gǎi le.","Một khi đã thành thói quen thì rất khó sửa.","Điền: 一旦出问题，我们___得负责。",["还","就","却"],1],
[3,"以至于","A，以至于 B","B là kết quả do mức độ của A, nghĩa “đến mức”, “dẫn đến”.","他太累了，以至于一躺下就睡着了。","Tā tài lèi le, yǐzhìyú yì tǎng xià jiù shuìzháo le.","Anh ấy mệt đến mức vừa nằm xuống là ngủ.","以至于 đứng trước:",["Nguyên nhân","Kết quả","Điều kiện"],1],
[3,"随着","随着 + N / cụm，S + V","Trạng ngữ đầu câu: cùng với sự thay đổi của một việc thì việc khác thay đổi theo.","随着经济的发展，人们的生活越来越好。","Suízhe jīngjì de fāzhǎn, rénmen de shēnghuó yuè lái yuè hǎo.","Cùng với sự phát triển kinh tế, đời sống ngày càng tốt hơn.","随着 thường đứng:",["Cuối câu","Đầu câu, làm trạng ngữ","Ngay sau 了"],1]
];
const K="hsk5-grammar-done",R="hsk5-grammar-score";
let done={},sc={},tab=0,cur=null,step=0;
try{done=JSON.parse(localStorage.getItem(K)||"{}");sc=JSON.parse(localStorage.getItem(R)||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(done));localStorage.setItem(R,JSON.stringify(sc))}catch(e){}};
const $=id=>document.getElementById(id);
const sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);
const ex=k=>[["c",D[k][7],D[k][8],D[k][9]]].concat((window.EX||[])[k]||[]);
const got=k=>Object.values(sc[k]||{}).reduce((a,b)=>a+b,0);
function head(){
  const n=Object.keys(done).length;
  $("fill").style.width=(n/D.length*100)+"%";
  $("cnt").textContent="Đã học "+n+" / "+D.length+" điểm";
  $("tabs").hidden=cur!=null;
  $("tabs").innerHTML=S.map((s,i)=>{
    const [a,b]=s.split("|"),t=D.filter(d=>d[0]==i),c=t.filter(d=>done[D.indexOf(d)]).length;
    return `<button role="tab" aria-selected="${i==tab}" data-i="${i}"><b>${a}</b>${b} · ${c}/${t.length}</button>`}).join("");
  document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{tab=+b.dataset.i;render()});
}
function render(){head();cur==null?list():lesson();window.scrollTo(0,0)}
function list(){
  $("list").innerHTML=D.map((d,k)=>d[0]!=tab?"":`<button class="item ${done[k]?"done":""}" data-k="${k}"><span class="dot"></span><span class="t"><span class="zh">${d[1].split(" — ")[0]}</span>${d[1].includes(" — ")?" — "+d[1].split(" — ")[1]:""}</span><small>${sc[k]?got(k)+"/"+ex(k).length+" bài đúng":""}</small></button>`).join("");
  document.querySelectorAll(".item").forEach(b=>b.onclick=()=>{cur=+b.dataset.k;step=0;render()});
}
function lesson(){
  const k=cur,d=D[k],x=ex(k),n=3+x.length+1;
  let h=`<button class="back" id="back">← Danh sách bài</button><h2 class="zh">${d[1]}</h2><div class="stepbar">Phần ${step+1} / ${n}</div>`;
  if(step==0)h+=`<h3>Cấu trúc</h3><div class="pat">${d[2]}</div>`;
  else if(step==1)h+=`<h3>Cách dùng</h3><ul>${d[3].split(/(?<=\.)\s+/).map(s=>`<li>${s}</li>`).join("")}</ul>`;
  else if(step==2)h+=`<h3>Ví dụ</h3><div class="ex"><div class="zh">${d[4]}</div><small>${d[5]}</small><small>${d[6]}</small></div>`;
  else if(step<n-1){
    const i=step-3,q=x[i],t=q[0];
    h+=`<h3>Bài tập ${i+1} / ${x.length}</h3><p class="q">${q[1]}</p>`;
    if(t=="c")h+=`<div class="opts" id="o"></div>`;
    if(t=="f")h+=`<div class="fill"><input id="in" autocomplete="off" aria-label="Đáp án"><button id="chk" class="pri">Kiểm tra</button></div>`;
    if(t=="r")h+=`<div class="ans zh" id="aw"></div><div class="opts zh" id="pool"></div><p><button id="chk" class="pri">Kiểm tra</button> <button id="clr">Làm lại</button></p>`;
    h+=`<div class="fb" id="fb" aria-live="polite"></div>`;
  }else h+=`<h3>Kết quả</h3><p>Ở lần thử đầu, bạn đúng <b>${got(k)} / ${x.length}</b> bài.</p><label class="chk"><input type="checkbox" id="dn" ${done[k]?"checked":""}> Đã học xong điểm này</label><p><button id="rt">Làm lại bài tập</button></p>`;
  h+=`<div class="nav"><button id="pv" ${step?"":"disabled"}>← Trước</button>${step<n-1?`<button id="nx" class="pri">Tiếp →</button>`:`<button id="bk" class="pri">Về danh sách</button>`}</div>`;
  $("list").innerHTML=h;
  $("back").onclick=()=>{cur=null;render()};
  $("pv").onclick=()=>{step--;render()};
  if($("nx"))$("nx").onclick=()=>{step++;render()};
  if($("bk"))$("bk").onclick=()=>{cur=null;render()};
  if($("dn"))$("dn").onchange=e=>{e.target.checked?done[k]=1:delete done[k];save();head()};
  if($("rt"))$("rt").onclick=()=>{delete sc[k];save();step=3;render()};
  if(step>=3&&step<n-1)drill(k,step-3,x[step-3]);
}
function drill(k,i,q){
  const fb=$("fb");let show;
  const fin=ok=>{if(sc[k]==null)sc[k]={};if(sc[k][i]==null){sc[k][i]=ok?1:0;save()}
    fb.textContent=ok?"Chính xác.":"Chưa đúng. Đáp án: "+show;fb.style.color=ok?"var(--ok)":"var(--bad)"};
  if(q[0]=="c"){show=q[2][q[3]];
    sh(q[2]).forEach(o=>{const b=document.createElement("button");b.textContent=o;b.onclick=()=>{const ok=o==show;b.className=ok?"ok":"bad";fin(ok)};$("o").append(b)});
  }else if(q[0]=="f"){show=q[2].split("|")[0];
    $("chk").onclick=()=>fin(q[2].split("|").includes($("in").value.trim()));
    $("in").onkeydown=e=>{if(e.key=="Enter")$("chk").click()};
  }else{show=q[2].join("");
    let pool=sh(q[2].map((w,j)=>[w,j])),as=[];
    const chip=(p,from,to)=>{const b=document.createElement("button");b.textContent=p[0];b.onclick=()=>{from.splice(from.indexOf(p),1);to.push(p);dr()};return b};
    const dr=()=>{$("pool").innerHTML="";$("aw").innerHTML="";pool.forEach(p=>$("pool").append(chip(p,pool,as)));as.forEach(p=>$("aw").append(chip(p,as,pool)))};
    dr();
    $("chk").onclick=()=>fin(as.map(p=>p[0]).join("")==show);
    $("clr").onclick=()=>{pool=sh(q[2].map((w,j)=>[w,j]));as=[];dr();fb.textContent=""};
  }
}
$("reset").onclick=()=>{if(confirm("Xóa toàn bộ tiến độ và điểm đã lưu?")){done={};sc={};save();cur=null;render()}};
render();
</script>
